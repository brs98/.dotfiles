## Framework Laptop 13 (AMD Ryzen 7040 Series) speaker crackling fix.
## The onboard ALC295 analog sink defaults to S32LE, which produces audible
## crackling and popping on this hardware. Forcing S16LE resolves it.
## See: https://wiki.archlinux.org/title/Framework_Laptop_13_(AMD_Ryzen_7040_Series)

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_c1_00.6.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
