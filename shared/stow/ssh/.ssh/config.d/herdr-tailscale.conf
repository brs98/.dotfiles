# Stable SSH aliases for Herdr's native remote attach over Tailscale MagicDNS.
# Authentication uses a distinct per-device key managed by herdr-remote-key.
Host herdr-omarchy
    HostName omarchy
    User brandon
    IdentityFile ~/.ssh/id_ed25519_herdr
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    ConnectionAttempts 1
    ConnectTimeout 8

Host herdr-omarchy-pc
    HostName omarchy-pc
    User brandon
    IdentityFile ~/.ssh/id_ed25519_herdr
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    ConnectionAttempts 1
    ConnectTimeout 8

Host herdr-mac
    HostName brandons-macbook-pro
    User brandon
    IdentityFile ~/.ssh/id_ed25519_herdr
    IdentitiesOnly yes
    StrictHostKeyChecking accept-new
    ConnectionAttempts 1
    ConnectTimeout 8
