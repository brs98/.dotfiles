onboarding = false

[keys]
# WezTerm forwards indexed tree/workspace shortcuts into the focused Herdr client.
# It also routes Option+Left/Right to the smart navigator below, which moves
# pane-first and wraps tabs from the opposite pane edge. The helper inherits
# HERDR_SOCKET_PATH, so it remains scoped to the default or named Herdr session.
jump_sidebar_item = ["alt+1..9", "alt+0"]
jump_sidebar_item_prompt = "alt+j"
focus_pane_left = ""
focus_pane_right = ""
switch_workspace = ["super+alt+1..9", "ctrl+alt+1..9"]

[[keys.command]]
key = "prefix+h"
type = "shell"
command = "$HOME/.local/bin/herdr-smart-navigate left"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "$HOME/.local/bin/herdr-smart-navigate right"

# Keep the same shortcuts working when Herdr runs outside WezTerm.
[[keys.command]]
key = "alt+left"
type = "shell"
command = "$HOME/.local/bin/herdr-smart-navigate left"

[[keys.command]]
key = "alt+right"
type = "shell"
command = "$HOME/.local/bin/herdr-smart-navigate right"

[theme]
name = "terminal"

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"
delay_seconds = 3
